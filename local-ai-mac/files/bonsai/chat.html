<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai Chat</title>
<style>
:root {
  --bg: #FAFAFA; --surface: #FFFFFF; --border: #E5E7EB; --text: #1F2937;
  --muted: #6B7280; --user: #F3F4F6; --code: #F3F4F6; --accent: #059669; --accent-dark: #047857;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827; --surface: #1F2937; --border: #374151; --text: #F3F4F6;
    --muted: #9CA3AF; --user: #374151; --code: #111827; --accent: #10B981; --accent-dark: #059669;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: center; gap: 16px; padding: 12px 24px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
header h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
label.think { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
label.think input { accent-color: var(--accent); width: 16px; height: 16px; }
button {
  font: inherit; font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer;
  padding: 8px 16px; transition: background 0.2s, border-color 0.2s;
}
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.secondary:hover { background: var(--user); }
.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); min-width: 72px; min-height: 44px; }
.primary:hover { background: var(--accent-dark); }
main { flex: 1; overflow-y: auto; padding: 24px 16px; }
.thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.empty { color: var(--muted); text-align: center; margin-top: 64px; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; max-width: 85%; background: var(--user); padding: 12px 16px; border-radius: 12px; }
.msg pre {
  background: var(--code); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; overflow-x: auto; margin: 8px 0; white-space: pre;
}
.msg code { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.msg :not(pre) > code { background: var(--code); padding: 2px 4px; border-radius: 4px; }
details { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
details summary { cursor: pointer; }
details div { border-left: 2px solid var(--border); padding-left: 16px; margin-top: 8px; }
.stats { color: var(--muted); font-size: 12px; margin-top: 8px; white-space: normal; }
.wait { color: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
footer { background: var(--surface); border-top: 1px solid var(--border); padding: 16px; }
.composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.attach { min-width: 44px; min-height: 44px; padding: 8px; font-size: 20px; line-height: 1; }
.preview { max-width: 760px; margin: 0 auto 8px; display: flex; align-items: flex-start; gap: 8px; }
.preview[hidden] { display: none; }
.preview img, .msg.user img { display: block; border-radius: 8px; border: 1px solid var(--border); }
.preview img { max-height: 96px; max-width: 160px; }
.preview button { padding: 2px 8px; }
.msg.user img { max-width: 100%; max-height: 320px; margin-bottom: 8px; }
textarea {
  flex: 1; font: inherit; color: var(--text); background: var(--bg); resize: none;
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; max-height: 200px;
}
</style>
</head>
<body>
<header>
  <h1>Bonsai Chat <span>Bonsai 2 27B, running on this Mac</span></h1>
  <label class="think"><input type="checkbox" id="think"> Think first</label>
  <button class="secondary" id="new">New chat</button>
</header>
<main id="main"><div class="thread" id="thread"><p class="empty" id="empty">Ask anything. Nothing leaves this computer.</p></div></main>
<footer>
  <div class="preview" id="preview" hidden>
    <img id="thumb" alt="Attached image">
    <button class="secondary" id="remove" aria-label="Remove image">×</button>
  </div>
  <div class="composer">
    <input type="file" id="file" accept="image/*" hidden>
    <button class="secondary attach" id="attach" aria-label="Attach an image" title="Attach an image">+</button>
    <textarea id="input" rows="1" placeholder="Message Bonsai" autofocus></textarea>
    <button class="primary" id="send">Send</button>
  </div>
</footer>
<script>
const $ = id => document.getElementById(id);
const main = $('main'), thread = $('thread'), input = $('input'), sendBtn = $('send');
let msgs = [], controller = null, image = null;
const MAX_EDGE = 1024;  // long side sent to the model; bigger images cost more reading time

function setImage(dataUrl) {
  image = dataUrl;
  $('thumb').src = dataUrl || '';
  $('preview').hidden = !dataUrl;
}

// Shrink to MAX_EDGE and re-encode as JPEG so the upload and the model's reading time stay small.
async function attach(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    setImage(c.toDataURL('image/jpeg', 0.9));
  } catch {
    alert('This browser could not read that image. Try a JPEG or PNG.');
  }
}

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// Just enough markdown for chat: fenced code, inline code, bold.
const md = s => s.split('```').map((part, i) => {
  if (i % 2) { const nl = part.indexOf('\n'); return '<pre><code>' + esc(nl < 0 ? part : part.slice(nl + 1)) + '</code></pre>'; }
  return esc(part.replace(/^\n+|\n+$/g, i ? '\n' : ''))
    .replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
}).join('');

function split(raw, think) {
  if (!think) return { reasoning: '', content: raw.trim() };
  const i = raw.indexOf('</think>');
  return i < 0 ? { reasoning: raw.trim(), content: '' }
               : { reasoning: raw.slice(0, i).trim(), content: raw.slice(i + 8).trim() };
}

function add(cls, html) {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.innerHTML = html;
  thread.appendChild(el);
  main.scrollTop = main.scrollHeight;
  return el;
}

function render(el, raw, think, stats) {
  const atBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
  const open = el.querySelector('details')?.open;
  const p = split(raw, think);
  el.innerHTML =
    (p.reasoning ? `<details${open || !p.content ? ' open' : ''}><summary>Thinking</summary><div>${esc(p.reasoning)}</div></details>` : '') +
    md(p.content) + (stats ? `<div class="stats">${stats}</div>` : '');
  if (atBottom) main.scrollTop = main.scrollHeight;
}

async function send() {
  if (controller) return controller.abort();
  const text = input.value.trim(), img = image;
  if (!text && !img) return;
  input.value = ''; input.style.height = 'auto';
  setImage(null);
  add('user', (img ? `<img src="${img}" alt="Attached image">` : '') + esc(text));
  msgs.push({ role: 'user', content: text, ...(img && { image: img }) });
  const think = $('think').checked, el = add('assistant', `<span class="wait">${img ? 'Looking at the image…' : 'Reading…'}</span>`);
  let raw = '', stats = '';
  controller = new AbortController();
  sendBtn.textContent = 'Stop';
  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: msgs, think }), signal: controller.signal,
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (let buf = ''; ;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      for (let i; (i = buf.indexOf('\n')) >= 0; buf = buf.slice(i + 1)) {
        const m = JSON.parse(buf.slice(0, i));
        if (m.t !== undefined) raw += m.t;
        else if (m.stats) stats = `${m.stats.tokens} tokens · ${m.stats.tps} tokens/s`;
        else if (m.error) stats = 'Error: ' + esc(m.error);
        render(el, raw, think, stats);
      }
    }
  } catch (e) {
    stats = e.name === 'AbortError' ? 'Stopped' : 'Could not reach the model: ' + esc(e.message);
    render(el, raw, think, stats);
  }
  const p = split(raw, think);
  if (raw) msgs.push({ role: 'assistant', content: p.content, reasoning_content: p.reasoning });
  else msgs.pop();
  controller = null;
  sendBtn.textContent = 'Send';
  input.focus();
}

sendBtn.onclick = send;
$('attach').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) attach(e.target.files[0]); e.target.value = ''; };
$('remove').onclick = () => setImage(null);
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!controller) send(); } };
input.oninput = () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; };
$('new').onclick = () => {
  controller?.abort();
  msgs = [];
  setImage(null);
  thread.innerHTML = '<p class="empty" id="empty">Ask anything. Nothing leaves this computer.</p>';
  input.focus();
};
</script>
</body>
</html>
